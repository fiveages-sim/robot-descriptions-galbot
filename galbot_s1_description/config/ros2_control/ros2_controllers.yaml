# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_wbc_controller:
      type: ocs2_arm_controller/Ocs2ArmController

    head_controller:
      type: basic_joint_controller/BasicJointController

    left_gripper_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

    right_gripper_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

ocs2_wbc_controller:
  ros__parameters:
    update_rate: 100  # Hz
    info_file_name: fixed_base

    joints:
      - body_joint
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7

    command_interfaces:
      - position
    state_interfaces:
      - position

    robot_name: galbot_s1

    # home_1 uses values from config/ocs2/task.info (initialState.arm)
    home_1: [0.5,
             1.0, -1.38, -0.5, -1.5708, 0.0, 0.0, 0.0,
             1.0, -1.38, -0.5, -1.5708, 0.0, 0.0, 0.0]
    home_2: [ 0.75,
              -1.0, -1.38, -0.5, -1.5708, 0.0, 0.0, 0.0,
              -1.0, -1.38, -0.5, -1.5708, 0.0, 0.0, 0.0 ]

head_controller:
  ros__parameters:
    update_rate: 100  # Hz

    joints:
      - head_joint1
      - head_joint2

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    home_1: [0.0, 0.0]
    home_2: [0.0, 0.0]

    home_duration: 5.0
    movej_duration: 5.0
    hold_position_threshold: 0.1

left_gripper_controller:
  ros__parameters:
    joint: left_gripper_joint
    force_feedback_ratio: 0.05
    force_threshold: 0.1

right_gripper_controller:
  ros__parameters:
    joint: right_gripper_joint
    force_feedback_ratio: 0.05
    force_threshold: 0.1
