/**:
  ros__parameters:
    # Linear and angular scales for joystick/keyboard control
    linear_scale: 0.01
    angular_scale: 0.005

    # VR update rate
    vr_update_rate: 500.0

    # Keep marker/control frame aligned with the full-body base frame.
    marker_fixed_frame: base_footprint
    control_base_frame: base_footprint
    reference_link: base_footprint

    # VR input toggle
    enable_vr: true
    head_link_name: "head_pitch_link"
