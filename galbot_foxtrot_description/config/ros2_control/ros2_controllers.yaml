# Base ros2_control config (no per-arm EEF). Asymmetric setups compose side templates via robot_common_launch.
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_wbc_controller:
      type: ocs2_wbc_controller/Ocs2WbcController

ocs2_wbc_controller:
  ros__parameters:
    robot_name: galbot_foxtrot
